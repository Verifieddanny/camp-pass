<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>CampPass</title>
<meta name="description" content="NYSC digital meal ticket, camp ID and passes. Works fully offline.">
<meta name="theme-color" content="#008751">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icons/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="CampPass">
<style>
:root{
  --green:#008751; --green-d:#006b40; --green-l:#e6f4ee; --green-m:#b9e2cf;
  --slate:#0F172A; --slate-2:#334155; --muted:#64748B; --line:#E2E8F0;
  --bg:#F8FAFC; --white:#fff;
  --amber:#F59E0B; --amber-d:#B45309; --amber-l:#FEF3C7;
  --red:#DC2626; --red-l:#FEE2E2;
  --violet:#6D28D9; --violet-l:#EDE9FE;
  --r:20px; --shadow:0 1px 2px rgba(15,23,42,.06),0 8px 24px rgba(15,23,42,.06);
  --safe-b:env(safe-area-inset-bottom,0px); --safe-t:env(safe-area-inset-top,0px);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--slate);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Inter,"Helvetica Neue",Arial,sans-serif;-webkit-font-smoothing:antialiased}
body{min-height:100dvh;overscroll-behavior-y:none}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer;padding:0}
button:focus-visible{outline:3px solid var(--green-m);outline-offset:2px}
.hidden{display:none!important}

/* ---------- Splash ---------- */
#splash{position:fixed;inset:0;z-index:100;background:linear-gradient(160deg,#00a862,#006b40);display:flex;flex-direction:column;align-items:center;justify-content:center;color:#fff;transition:opacity .45s ease,visibility .45s}
#splash.gone{opacity:0;visibility:hidden}
#splash .logo{width:104px;height:104px;border-radius:28px;background:rgba(255,255,255,.14);display:grid;place-items:center;animation:pop .7s cubic-bezier(.2,1.4,.4,1) both;box-shadow:0 20px 50px rgba(0,0,0,.18)}
#splash h1{margin:22px 0 4px;font-size:34px;letter-spacing:-.5px;animation:rise .6s .15s both}
#splash p{margin:0;opacity:.85;font-size:15px;animation:rise .6s .25s both}
#splash .bar{margin-top:36px;width:120px;height:4px;border-radius:4px;background:rgba(255,255,255,.25);overflow:hidden}
#splash .bar i{display:block;height:100%;width:40%;background:#fff;border-radius:4px;animation:load 1.1s ease-in-out infinite}
#splash .foot{position:absolute;bottom:calc(28px + var(--safe-b));font-size:12px;opacity:.75;letter-spacing:.3px}
@keyframes pop{from{transform:scale(.6);opacity:0}to{transform:scale(1);opacity:1}}
@keyframes rise{from{transform:translateY(10px);opacity:0}to{transform:none;opacity:1}}
@keyframes load{0%{transform:translateX(-100%)}100%{transform:translateX(260%)}}

/* ---------- Header ---------- */
header{position:sticky;top:0;z-index:20;background:rgba(248,250,252,.92);backdrop-filter:saturate(1.6) blur(14px);-webkit-backdrop-filter:saturate(1.6) blur(14px);padding:calc(10px + var(--safe-t)) 16px 10px;border-bottom:1px solid transparent;transition:border-color .2s}
header.scrolled{border-color:var(--line)}
.hrow{display:flex;align-items:center;gap:10px;max-width:560px;margin:0 auto}
.brand{display:flex;align-items:center;gap:8px;font-weight:800;font-size:18px;letter-spacing:-.3px}
.brand .mark{width:32px;height:32px;border-radius:10px;overflow:hidden;flex:none}
.role{margin-left:auto;display:flex;background:#E9EEF4;border-radius:999px;padding:3px;position:relative}
.role button{position:relative;z-index:1;padding:8px 12px;font-size:13px;font-weight:700;border-radius:999px;color:var(--slate-2);transition:color .2s;display:flex;align-items:center;gap:5px;min-height:36px}
.role button[aria-pressed=true]{color:#fff}
.role .thumb{position:absolute;top:3px;bottom:3px;left:3px;border-radius:999px;background:var(--green);transition:transform .3s cubic-bezier(.3,1.3,.5,1),width .3s,background .3s;box-shadow:0 2px 6px rgba(0,135,81,.35)}
.role.kitchen .thumb{background:var(--slate)}
.iconbtn{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;color:var(--slate-2);flex:none}
.iconbtn:active{background:#E9EEF4}

/* ---------- Layout ---------- */
main{max-width:560px;margin:0 auto;padding:6px 16px calc(100px + var(--safe-b))}
.view{animation:fade .3s ease both}
@keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
h2.title{font-size:26px;letter-spacing:-.6px;margin:10px 0 2px}
.sub{color:var(--muted);font-size:14px;margin:0 0 14px}
.card{background:var(--white);border-radius:var(--r);box-shadow:var(--shadow);padding:16px;margin-bottom:14px}
.sec{font-size:12px;font-weight:800;letter-spacing:.8px;text-transform:uppercase;color:var(--muted);margin:22px 4px 10px}

.status-pill{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:700;padding:6px 10px;border-radius:999px;background:var(--green-l);color:var(--green-d)}
.status-pill .dot{width:8px;height:8px;border-radius:50%;background:var(--green);box-shadow:0 0 0 3px rgba(0,135,81,.18)}
.status-pill.off{background:var(--amber-l);color:var(--amber-d)}
.status-pill.off .dot{background:var(--amber);box-shadow:0 0 0 3px rgba(245,158,11,.2)}

/* ---------- Segmented meal selector ---------- */
.seg{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;background:#E9EEF4;border-radius:16px;padding:5px;margin-bottom:14px}
.seg button{padding:10px 4px;border-radius:12px;font-weight:700;font-size:14px;color:var(--slate-2);display:flex;flex-direction:column;align-items:center;gap:1px;min-height:52px;transition:background .2s,color .2s,box-shadow .2s;position:relative}
.seg button small{font-weight:600;font-size:11px;color:var(--muted)}
.seg button[aria-pressed=true]{background:#fff;color:var(--slate);box-shadow:0 2px 8px rgba(15,23,42,.1)}
.seg .mdot{position:absolute;top:7px;right:9px;width:8px;height:8px;border-radius:50%}

/* ---------- Ticket ---------- */
.ticket{position:relative;border-radius:24px;background:#fff;box-shadow:var(--shadow);overflow:hidden;transition:box-shadow .3s}
.ticket .top{padding:18px 18px 16px;color:#fff;background:linear-gradient(135deg,#00a862,#007547);position:relative;transition:background .4s}
.ticket.queued .top{background:linear-gradient(135deg,#FBBF24,#D97706)}
.ticket.served .top{background:linear-gradient(135deg,#0f9d63,#065f3c)}
.ticket.rollover .top{background:linear-gradient(135deg,#7C3AED,#4C1D95)}
.ticket .top .k{font-size:12px;font-weight:700;opacity:.85;letter-spacing:.6px;text-transform:uppercase}
.ticket .top .meal{font-size:28px;font-weight:800;letter-spacing:-.6px;margin:2px 0 10px;display:flex;align-items:center;gap:8px}
.badge{display:inline-flex;align-items:center;gap:6px;padding:7px 11px;border-radius:999px;font-size:12px;font-weight:800;letter-spacing:.4px;background:rgba(255,255,255,.22);color:#fff;backdrop-filter:blur(4px)}
.badge.solid{background:#fff;color:var(--green-d)}
.ticket.queued .badge.solid{color:var(--amber-d)}
.ticket.rollover .badge.solid{color:var(--violet)}
.badge .pulse{width:8px;height:8px;border-radius:50%;background:currentColor;animation:pulse 1.4s infinite}
@keyframes pulse{0%{box-shadow:0 0 0 0 currentColor}70%{box-shadow:0 0 0 8px transparent}100%{box-shadow:0 0 0 0 transparent}}
.ticket .tear{height:22px;position:relative;background:#fff}
.ticket .tear:before,.ticket .tear:after{content:"";position:absolute;top:0;width:22px;height:22px;border-radius:50%;background:var(--bg)}
.ticket .tear:before{left:-11px}.ticket .tear:after{right:-11px}
.ticket .tear i{position:absolute;left:18px;right:18px;top:10px;border-top:2px dashed var(--line)}
.ticket .body{padding:0 18px 18px}
.qrwrap{display:flex;justify-content:center;padding:4px 0 12px}
.qr{width:212px;height:212px;padding:12px;border-radius:18px;background:#fff;border:1px solid var(--line);position:relative}
.qr svg{width:100%;height:100%;display:block}
.qr.dim svg{opacity:.12;filter:grayscale(1)}
.qr .over{position:absolute;inset:0;display:grid;place-items:center;text-align:center}
.qr .over .big{width:84px;height:84px;border-radius:50%;display:grid;place-items:center;color:#fff;background:var(--green);box-shadow:0 10px 30px rgba(0,135,81,.35);animation:pop .5s cubic-bezier(.2,1.5,.4,1) both}
.ticket .code{text-align:center;font:700 13px ui-monospace,SFMono-Regular,Menlo,monospace;color:var(--muted);letter-spacing:1px;margin-top:-4px}
.msg{border-radius:14px;padding:12px 14px;font-size:14px;line-height:1.45;margin-top:12px}
.msg.info{background:var(--green-l);color:#065f3c}
.msg.warn{background:var(--amber-l);color:#7c2d12}
.msg.vio{background:var(--violet-l);color:#3b0764}
.rows{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:14px}
.rows div{background:var(--bg);border-radius:12px;padding:10px 12px}
.rows span{display:block;font-size:11px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.5px}
.rows b{font-size:15px}

/* Steps */
.steps{display:flex;align-items:flex-start;margin:16px 2px 2px}
.step{flex:1;display:flex;flex-direction:column;align-items:center;text-align:center;font-size:11px;font-weight:700;color:var(--muted);position:relative}
.step .c{width:30px;height:30px;border-radius:50%;background:#EEF2F6;color:#94A3B8;display:grid;place-items:center;font-size:13px;margin-bottom:6px;position:relative;z-index:1;transition:all .3s}
.step:not(:last-child):after{content:"";position:absolute;top:15px;left:calc(50% + 18px);right:calc(-50% + 18px);height:3px;border-radius:3px;background:#EEF2F6}
.step.done .c{background:var(--green);color:#fff}
.step.done:not(:last-child):after{background:var(--green)}
.step.now .c{background:var(--amber);color:#fff;box-shadow:0 0 0 5px rgba(245,158,11,.2)}
.step.vio .c{background:var(--violet);color:#fff;box-shadow:0 0 0 5px rgba(109,40,217,.15)}
.step.done,.step.now,.step.vio{color:var(--slate)}

.hint{display:flex;align-items:center;gap:10px;margin-top:14px;padding:12px 14px;border-radius:14px;border:1.5px dashed var(--line);font-size:13px;color:var(--slate-2);width:100%;text-align:left}
.hint b{color:var(--green-d)}

/* ---------- ID Card ---------- */
.idcard{border-radius:24px;overflow:hidden;background:#fff;box-shadow:var(--shadow);position:relative}
.idcard .band{background:linear-gradient(135deg,#00a862,#006b40);color:#fff;padding:16px 18px 54px;position:relative;overflow:hidden}
.idcard .band:after{content:"";position:absolute;right:-60px;top:-60px;width:200px;height:200px;border-radius:50%;background:rgba(255,255,255,.08)}
.idcard .band .k{font-size:11px;font-weight:800;letter-spacing:1.2px;opacity:.85}
.idcard .band .t{font-size:16px;font-weight:800;margin-top:2px}
.idcard .flag{display:flex;height:6px}
.idcard .flag i{flex:1}
.idcard .who{display:flex;gap:14px;align-items:flex-end;padding:0 18px;margin-top:-44px;position:relative}
.avatar{width:84px;height:84px;border-radius:22px;background:linear-gradient(135deg,#e6f4ee,#b9e2cf);border:4px solid #fff;display:grid;place-items:center;font-size:30px;font-weight:800;color:var(--green-d);flex:none;box-shadow:0 6px 16px rgba(15,23,42,.12)}
.who .n{font-size:20px;font-weight:800;letter-spacing:-.3px;line-height:1.2}
.who .sc{font:800 14px ui-monospace,SFMono-Regular,Menlo,monospace;color:var(--green-d);margin-top:3px}
.idcard .grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;padding:16px 18px 6px}
.idcard .grid div span{display:block;font-size:11px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.5px}
.idcard .grid div b{font-size:15px}
.idcard .qrrow{display:flex;gap:14px;align-items:center;padding:12px 18px 18px}
.idcard .qrrow .qr{width:128px;height:128px;padding:8px;border-radius:14px;flex:none}
.idcard .qrrow p{margin:0;font-size:13px;color:var(--muted);line-height:1.45}

/* ---------- Passes ---------- */
.pass{display:flex;gap:14px;align-items:center}
.pass .ic{width:52px;height:52px;border-radius:16px;display:grid;place-items:center;flex:none}
.pass h3{margin:0;font-size:17px}
.pass p{margin:2px 0 0;color:var(--muted);font-size:13px}
.verified{margin-left:auto;font-size:11px;font-weight:800;color:var(--green-d);background:var(--green-l);padding:6px 9px;border-radius:999px;display:flex;gap:4px;align-items:center;flex:none}
.check{display:flex;align-items:center;gap:12px;padding:13px 2px;border-top:1px solid var(--line)}
.check:first-of-type{border-top:0}
.check .bx{width:28px;height:28px;border-radius:9px;display:grid;place-items:center;flex:none}
.check.ok .bx{background:var(--green);color:#fff}
.check.no .bx{background:#F1F5F9;color:#94A3B8;border:2px dashed #CBD5E1}
.check .tx{flex:1}
.check .tx b{display:block;font-size:15px}
.check .tx small{color:var(--muted);font-size:12px}
.progress{height:10px;background:#EEF2F6;border-radius:10px;overflow:hidden;margin:10px 0 4px}
.progress i{display:block;height:100%;background:linear-gradient(90deg,#00a862,#008751);border-radius:10px;transition:width .6s}

/* ---------- History ---------- */
.day{margin-bottom:14px}
.day h4{margin:0 0 8px 4px;font-size:13px;color:var(--muted);font-weight:800}
.hitem{display:flex;align-items:center;gap:12px;padding:12px 0;border-top:1px solid var(--line)}
.hitem:first-child{border-top:0;padding-top:2px}
.hitem .em{width:42px;height:42px;border-radius:14px;display:grid;place-items:center;font-size:20px;background:var(--bg);flex:none}
.hitem .tx{flex:1;min-width:0}
.hitem .tx b{display:block;font-size:15px}
.hitem .tx small{color:var(--muted);font-size:12px}
.chip{font-size:11px;font-weight:800;padding:6px 9px;border-radius:999px;letter-spacing:.3px;white-space:nowrap}
.chip.served{background:var(--green-l);color:var(--green-d)}
.chip.queued{background:var(--amber-l);color:var(--amber-d)}
.chip.rollover{background:var(--violet-l);color:var(--violet)}
.chip.ready{background:#F1F5F9;color:var(--slate-2)}
.chip.missed{background:#F1F5F9;color:var(--muted)}
.stats3{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:14px}
.stat{background:#fff;border-radius:16px;box-shadow:var(--shadow);padding:12px;text-align:center}
.stat b{display:block;font-size:24px;letter-spacing:-.5px}
.stat span{font-size:11px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.4px}

/* ---------- Kitchen ---------- */
.kgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.kbox{border-radius:16px;padding:12px 14px;background:var(--bg)}
.kbox span{font-size:11px;font-weight:800;color:var(--muted);text-transform:uppercase;letter-spacing:.5px}
.kbox b{display:block;font-size:30px;letter-spacing:-1px;line-height:1.15;font-variant-numeric:tabular-nums}
.kbox.big{grid-column:1/-1;background:var(--slate);color:#fff;display:flex;align-items:center;justify-content:space-between}
.kbox.big span{color:#94A3B8}
.kbox.big b{font-size:52px}
.kbox.big.low{background:linear-gradient(135deg,#B45309,#92400E)}
.kbox.big.zero{background:linear-gradient(135deg,#B91C1C,#7F1D1D)}
.stepper{display:flex;gap:8px}
.stepper button{width:52px;height:52px;border-radius:16px;background:rgba(255,255,255,.14);color:#fff;font-size:26px;font-weight:700;display:grid;place-items:center}
.stepper button:active{background:rgba(255,255,255,.28)}
.meter{height:12px;border-radius:12px;background:#EEF2F6;overflow:hidden;display:flex;margin:14px 0 6px}
.meter i{display:block;height:100%;transition:width .5s}
.legend{display:flex;gap:12px;flex-wrap:wrap;font-size:12px;color:var(--muted);font-weight:600}
.legend span{display:flex;align-items:center;gap:5px}
.legend i{width:10px;height:10px;border-radius:3px;display:inline-block}
.risk{margin-top:12px;padding:11px 13px;border-radius:12px;background:var(--amber-l);color:#7c2d12;font-size:13px;font-weight:600;display:flex;gap:8px;align-items:flex-start}

.btn{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;min-height:56px;border-radius:16px;font-weight:800;font-size:16px;padding:0 16px;transition:transform .1s,opacity .2s,background .2s}
.btn:active{transform:scale(.98)}
.btn[disabled]{opacity:.38;pointer-events:none}
.btn.primary{background:var(--green);color:#fff;box-shadow:0 6px 18px rgba(0,135,81,.28)}
.btn.amber{background:var(--amber);color:#3b1d02;box-shadow:0 6px 18px rgba(245,158,11,.3)}
.btn.violet{background:var(--violet);color:#fff;box-shadow:0 6px 18px rgba(109,40,217,.28)}
.btn.dark{background:var(--slate);color:#fff}
.btn.ghost{background:#fff;border:1.5px solid var(--line);color:var(--slate)}
.btn.danger{background:var(--red-l);color:var(--red);border:1.5px solid #FECACA}
.btn .num{width:26px;height:26px;border-radius:50%;background:rgba(255,255,255,.25);display:grid;place-items:center;font-size:13px}
.btn.amber .num{background:rgba(0,0,0,.1)}
.stack{display:grid;gap:10px}

.scanee{display:flex;align-items:center;gap:12px;padding:12px;border-radius:16px;background:var(--bg);margin-bottom:14px}
.scanee .avatar{width:48px;height:48px;border-radius:14px;font-size:18px;border-width:0;box-shadow:none}
.scanee b{display:block;font-size:15px}
.scanee small{font:700 12px ui-monospace,Menlo,monospace;color:var(--muted)}
.scanee .chip{margin-left:auto}

.scanner{position:relative;border-radius:18px;overflow:hidden;background:#000;aspect-ratio:1/1;margin-bottom:12px}
.scanner video{width:100%;height:100%;object-fit:cover}
.scanner .frame{position:absolute;inset:18%;border:3px solid rgba(255,255,255,.9);border-radius:22px;box-shadow:0 0 0 999px rgba(0,0,0,.35)}
.scanner .laser{position:absolute;left:18%;right:18%;height:2px;background:#22c55e;box-shadow:0 0 12px #22c55e;animation:laser 1.8s ease-in-out infinite alternate;top:18%}
@keyframes laser{to{top:82%}}

table.audit{width:100%;border-collapse:collapse;font-size:14px}
.audit th{font-size:11px;text-transform:uppercase;letter-spacing:.5px;color:var(--muted);text-align:left;padding:0 0 8px;font-weight:800}
.audit td{padding:9px 0;border-top:1px solid var(--line);font-variant-numeric:tabular-nums}
.audit td.n{text-align:right;font-weight:700;width:58px}
.audit th.n{text-align:right}
.audit tr.me td{background:linear-gradient(90deg,var(--green-l),transparent)}
.audit .bar{height:8px;border-radius:8px;background:#EEF2F6;overflow:hidden;display:flex;margin-top:4px;max-width:150px}
.audit .bar i{height:100%}
.log{list-style:none;margin:0;padding:0}
.log li{display:flex;gap:10px;padding:10px 0;border-top:1px solid var(--line);font-size:13px;align-items:flex-start}
.log li:first-child{border-top:0}
.log time{font:700 12px ui-monospace,Menlo,monospace;color:var(--muted);flex:none;width:62px;padding-top:1px}
.log .d{width:8px;height:8px;border-radius:50%;margin-top:5px;flex:none}

/* ---------- Bottom nav ---------- */
nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:30;background:rgba(255,255,255,.96);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-top:1px solid var(--line);padding:6px 8px calc(6px + var(--safe-b))}
nav.tabs .in{max-width:560px;margin:0 auto;display:flex}
nav.tabs button{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;padding:6px 0 4px;font-size:11px;font-weight:700;color:#94A3B8;min-height:56px;border-radius:14px;position:relative}
nav.tabs button svg{transition:transform .2s}
nav.tabs button[aria-current=page]{color:var(--green)}
nav.tabs.kitchen button[aria-current=page]{color:var(--slate)}
nav.tabs button[aria-current=page] svg{transform:translateY(-1px) scale(1.08)}
nav.tabs button[aria-current=page]:before{content:"";position:absolute;top:-7px;width:28px;height:3px;border-radius:0 0 3px 3px;background:currentColor}
nav.tabs .nb{position:absolute;top:4px;left:calc(50% + 8px);min-width:9px;height:9px;border-radius:9px;background:var(--amber);border:2px solid #fff}

/* ---------- Sheet / toast / install ---------- */
.scrim{position:fixed;inset:0;background:rgba(15,23,42,.45);z-index:60;opacity:0;visibility:hidden;transition:opacity .25s,visibility .25s}
.scrim.open{opacity:1;visibility:visible}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:61;background:#fff;border-radius:26px 26px 0 0;padding:10px 18px calc(22px + var(--safe-b));transform:translateY(105%);transition:transform .32s cubic-bezier(.2,.9,.3,1);max-width:560px;margin:0 auto;max-height:88dvh;overflow:auto}

<script>
(function(){
'use strict';
const E = window.CampEngine;
const { MEALS, MEAL, PLATOONS } = E;

/* =========================================================
   Local state: world (shared camp data) + ui (this phone only)
   ========================================================= */
const WKEY = 'camppass.world.v3', UKEY = 'camppass.ui.v3', OKEY = 'camppass.outbox.v3';
const today = () => E.dkey(new Date());
const read = (k) => { try { return JSON.parse(localStorage.getItem(k)); } catch(e){ return null; } };
const write = (k,v) => { try { localStorage.setItem(k, JSON.stringify(v)); } catch(e){} };

let W = read(WKEY);
if (!W || W.v !== E.VERSION) W = E.seedWorld(today());
let outbox = read(OKEY) || [];
const defaultMeal = () => E.currentMeal();
let U = Object.assign({role:'member', tab:'meal', ktab:'gate', me:E.DEMO_CODE, q:''}, read(UKEY)||{});
U.meal = defaultMeal(); // always open on the meal being served now
if (!W.members[U.me]) U.me = E.DEMO_CODE;
let net = 'connecting'; // connecting | live | syncing | offline | local
let serverBase = null;   // world from the server, before local pending actions

const saveAll = () => { write(WKEY, W); write(UKEY, U); write(OKEY, outbox); };
const ensure = () => E.ensureDay(W, today());
const ME = () => W.members[U.me];
const P = () => ME().profile;
const T = (m=U.meal, code=U.me) => W.members[code].tickets[today()][m];
const ST = (m=U.meal) => E.stats(W, today(), m);
const qpos = (m=U.meal, code=U.me) => E.queuePos(W, today(), m, code);

/* =========================================================
   Sync with the server (REST + live Server-Sent Events)
   Actions apply locally first, so the app never waits on the network.
   ========================================================= */
function act(a){
  a = Object.assign({day: today(), meal: U.meal, at: Date.now(), id: Math.random().toString(36).slice(2)}, a);
  ensure();
  const res = E.apply(W, a);
  if (!res.ok){ fail(res.msg); return res; }
  outbox.push(a); saveAll();
  if (!res.quiet) toast(res.msg, res.tone);
  fx(res.fx);
  render(); flush();
  return res;
}

let flushing = false;
async function flush(){
  if (flushing || !outbox.length || net === 'local') return;
  flushing = true;
  const batch = outbox.slice();
  if (net !== 'offline') setNet('syncing');
  try{
    const r = await fetch('api/actions', {method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({actions: batch})});
    if (!r.ok) throw new Error(r.status);
    const data = await r.json();
    outbox = outbox.slice(batch.length);
    adoptServer(data.world);
    setNet(sse && sse.readyState === 1 ? 'live' : 'live');
  }catch(e){ setNet(navigator.onLine ? 'offline' : 'offline'); }
  flushing = false;
  if (outbox.length && net !== 'offline') setTimeout(flush, 300);
}

// Server is the source of truth; re-apply anything this phone has not sent yet.
function adoptServer(world){
  if (!world || world.v !== E.VERSION) return;
  serverBase = world;
  const w = JSON.parse(JSON.stringify(world));
  for (const a of outbox) { try { E.apply(w, a); } catch(e){} }
  const prevStatus = T().status;
  W = w; ensure();
  if (!W.members[U.me]) U.me = E.DEMO_CODE;
  saveAll();
  const now = T().status;
  if (U.role === 'member' && now !== prevStatus){
    if (now === 'queued') { toast(`Checked in · #${qpos()} in queue`, 'amber'); buzz(30); }
    if (now === 'served') { toast('Plate handed over · Served', 'green'); fx('served'); }
    if (now === 'rollover') { toast('Food finished · Priority Rollover Pass issued', 'violet'); buzz([60,60,60]); }
  }
  if (!document.querySelector('.sheet.open input')) render();
}

let sse = null;
async function connect(){
  try{
    const r = await fetch('api/state?day=' + today(), {cache:'no-store'});
    if (r.status === 404){ setNet('local'); return; }   // static hosting, no backend: run fully on-device
    if (!r.ok) throw new Error(r.status);
    const data = await r.json();
    adoptServer(data.world);
    setNet('live');
    flush();
    openStream();
    startPoll();
  }catch(e){
    setNet('offline');
    setTimeout(connect, 8000);
  }
}
function openStream(){
  if (!('EventSource' in window) || sse) return;
  sse = new EventSource('api/stream');
  sse.addEventListener('world', (ev) => { try { if (!flushing) adoptServer(JSON.parse(ev.data)); } catch(e){} if (net!=='syncing') setNet('live'); });
  // Serverless hosts cut long streams; EventSource reconnects by itself and polling covers the gap.
  sse.onerror = () => { if (sse && sse.readyState === 2){ sse = null; setTimeout(openStream, 5000); } };
  sse.onopen = () => { setNet('live'); flush(); };
}
// Polling keeps every phone in step even when instances don't share a live stream.
let pollTimer = null;
function startPoll(){ clearInterval(pollTimer); pollTimer = setInterval(poll, 2500); }
async function poll(){
  if (document.hidden || flushing || net === 'local') return;
  if (outbox.length){ flush(); return; }
  try{
    const rev = serverBase ? serverBase.rev : 0;
    const r = await fetch(`api/state?day=${today()}&rev=${rev}`, {cache:'no-store'});
    if (!r.ok) throw new Error(r.status);
    const d = await r.json();
    if (!d.same && !flushing && !outbox.length) adoptServer(d.world);
    setNet('live');
  }catch(e){ setNet('offline'); }
}
function setNet(s){ if (net === s) return; net = s; document.querySelectorAll('[data-net]').forEach(el => el.outerHTML = onlineState()); }
window.addEventListener('online', () => { if (net==='local') return; connect(); });
window.addEventListener('offline', () => { if (net!=='local') setNet('offline'); });

/* =========================================================
   UI helpers
   ========================================================= */
const $ = s => document.querySelector(s);
const esc = s => String(s==null?'':s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function buzz(p){ try { navigator.vibrate && navigator.vibrate(p); } catch(e){} }
const fmtTime = ts => ts ? new Date(ts).toLocaleTimeString([], {hour:'numeric', minute:'2-digit'}) : '—';
const fmtDay = k => {
  if (k === today()) return 'Today';
  if (k === E.shiftDay(today(), -1)) return 'Yesterday';
  const [y,m,d] = k.split('-').map(Number);
  return new Date(y,m-1,d).toLocaleDateString([], {weekday:'long', day:'numeric', month:'short'});
};
const initials = (p=P()) => (p.first[0]+p.last[0]).toUpperCase();

function qrSvg(text, dark='#0F172A'){
  try{
    const q = qrcode(0, 'M'); q.addData(text); q.make();
    const n = q.getModuleCount(); let d = '';
    for (let r=0;r<n;r++) for (let c=0;c<n;c++) if (q.isDark(r,c)) d += `M${c},${r}h1v1h-1z`;
    return `<svg viewBox="-1 -1 ${n+2} ${n+2}" shape-rendering="crispEdges" role="img" aria-label="QR code"><path d="${d}" fill="${dark}"/></svg>`;
  }catch(e){ return '<svg viewBox="0 0 10 10"></svg>'; }
}
function payload(m){
  const t = T(m), kind = (t.status==='rollover' && !t.redeemedAt) ? 'PRIORITY' : 'MEAL';
  return `CAMPPASS|${kind}|${P().stateCode}|${today()}|${m.toUpperCase()}|${E.token(P().stateCode, today(), m, kind)}`;
}

const ICON = {
  check: hi('check', 16, 'bold'), bigcheck: hi('check', 46, 'bold'), star: hi('star', 16), clock: hi('clock', 16),
  plate: hi('plate'), scan: hi('tGate'), cam: hi('cam', 22), bed: hi('bed', 26), shield: hi('shield', 26),
  x: hi('x', 16, 'bold'), alert: hi('alert', 18), search: hi('search'), user: hi('user', 16), chef: hi('chef', 16)
};
const TAB_ICONS = {
  meal: hi('tMeal', 24), id: hi('tId', 24), passes: hi('tPasses', 24), history: hi('tHistory', 24),
  gate: hi('tGate', 24), queue: hi('tQueue', 24), rations: hi('tRations', 24), audit: hi('tAudit', 24)
};

let toastTimer;
function toast(msg, tone='green'){
  const colors = {green:'#008751', amber:'#F59E0B', violet:'#7C3AED', red:'#DC2626', dark:'#334155'};
  const icon = tone==='red' ? ICON.x : tone==='violet' ? ICON.star : tone==='amber' ? ICON.clock : ICON.check;
  const el = $('#toast');
  el.innerHTML = `<span class="ti" style="background:${colors[tone]||colors.dark}">${icon}</span><span>${esc(msg)}</span>`;
  el.classList.add('show'); clearTimeout(toastTimer);
  toastTimer = setTimeout(()=>el.classList.remove('show'), 2600);
}
function fail(msg){ toast(msg, 'red'); buzz([40,30,40]); return false; }
function fx(kind){
  if (kind==='served'){ buzz([20,40,20]); confetti(); }
  else if (kind==='checkin') buzz(30);
  else if (kind==='rollover' || kind==='finish'){ buzz([80,40,80]); const a=$('#app'); a.classList.add('shake'); setTimeout(()=>a.classList.remove('shake'),500); }
}
function confetti(){
  const c = document.createElement('div'); c.className='confetti';
  const cols = ['#008751','#00a862','#F59E0B','#ffffff','#0F172A'];
  for (let i=0;i<46;i++){
    const p = document.createElement('i');
    p.style.left = Math.random()*100+'%'; p.style.background = cols[i%cols.length];
    p.style.animationDelay = Math.random()*.35+'s'; p.style.animationDuration = 1.2+Math.random()*.9+'s';
    if (i%5===3) p.style.boxShadow = 'inset 0 0 0 1px #cbd5e1';
    c.appendChild(p);
  }
  document.body.appendChild(c); setTimeout(()=>c.remove(), 2600);
}

function onlineState(){
  const pend = outbox.length;
  const m = {
    live:    ['', 'live', 'Live · Synced'],
    syncing: ['sync', '', 'Syncing…'],
    connecting: ['sync', '', 'Connecting…'],
    offline: ['off', '', pend ? `No signal · ${pend} change${pend>1?'s':''} saved` : 'Offline Ready · Saved on device'],
    local:   ['local', '', 'Offline Ready · On-device mode'],
  }[net] || ['', '', 'Offline Ready'];
  return `<span class="status-pill ${m[0]} ${m[1]}" data-net><span class="dot"></span>${m[2]}</span>`;
}

function render(){

  role.querySelectorAll('button').forEach(b => b.setAttribute('aria-pressed', String(b.dataset.role===U.role)));
  placeThumb();
  // The whole app takes the colour of the ticket's status.
  const t0 = T(), status = isK ? 'kitchen' : (t0.status==='rollover' && t0.redeemedAt) ? 'served' : t0.status;
  document.body.dataset.status = status;
  document.querySelector('meta[name=theme-color]').setAttribute('content', THEME[status] || '#008751');

  const tabs = isK ? KITCHEN_TABS : MEMBER_TABS;
  const cur = isK ? U.ktab : U.tab;
  $('#tabs').classList.toggle('kitchen', isK);
  $('#tabsIn').innerHTML = tabs.map(([id,label]) => {
    const dot = (!isK && id==='meal' && (T().status==='queued' || E.pendingRollover(W, U.me, today()))) ? '<span class="nb"></span>'
              : (isK && id==='queue' && ST().queue.length) ? `<span class="nb cnt">${ST().queue.length}</span>` : '';
    return `<button data-tab="${id}" ${id===cur?'aria-current="page"':''}>${TAB_ICONS[id]}${label}${dot}</button>`;
  }).join('');

  if (isK) trackQueue();
  const html = isK ? ({gate:vGate, queue:vQueue, rations:vRations, audit:vAudit}[U.ktab]||vGate)()
                   : ({meal:vMeal, id:vId, passes:vPasses, history:vHistory}[U.tab]||vMeal)();
  const key = `${U.role}-${cur}`;
  const app = $('#app');
  const animate = app.dataset.key !== key;
  app.dataset.key = key;
  const search = document.activeElement && document.activeElement.id === 'gateSearch';
  app.innerHTML = `<div class="${animate?'view':''}">${html}</div>`;
  if (search){ const i = $('#gateSearch'); if (i){ i.focus(); i.setSelectionRange(i.value.length, i.value.length); } }
  filterGate();
}

}

function steps(t){

function statusChip(t){
  if (t.status==='served') return `<span class="chip served">${t.priority?ICON.star:''}SERVED</span>`;
  if (t.status==='queued') return `<span class="chip queued">IN QUEUE</span>`;
  if (t.status==='rollover') return t.redeemedAt ? `<span class="chip served">${ICON.star}SERVED</span>` : `<span class="chip rollover">${ICON.star}PRIORITY</span>`;
  if (t.status==='missed') return `<span class="chip missed">NOT USED</span>`;
  return `<span class="chip ready">READY</span>`;
}
function vHistory(){
  const tk = ME().tickets, days = Object.keys(tk).sort().reverse();

  days.forEach(d=>MEALS.forEach(m=>{ const t=tk[d][m.id]; if(!t) return;

    if (t.status==='rollover') ro++; }));
  return `

      <div class="stat"><b style="color:var(--green-d)">${served}</b><span>Eaten</span></div>

  openSheet(`
    <div style="display:flex;align-items:center;justify-content:space-between;gap:10px"><h3>${title}</h3><span class="chip ${mode==='checkin'?'queued':'served'}">${MEAL[U.meal].name.toUpperCase()}</span></div>
    <div class="scanner" id="scanBox"><video playsinline muted autoplay></video><div class="frame"></div><div class="laser"></div></div>
    <div id="scanMsg" class="msg info" style="margin:0 0 12px">Starting camera…</div>
    <div class="stack"><button class="btn ghost" data-act="close">Done</button></div>`);
  startCamera(mode);
}
function scanMsg(html, tone='info'){ const m = $('#scanMsg'); if (m){ m.className = `msg ${tone}`; m.style.margin = '0 0 12px'; m.innerHTML = html; } }
async function startCamera(mode){
  stopCamera();
  if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia){ scanMsg('This browser cannot open the camera. Use the Check in and Serve buttons instead.', 'warn'); return; }
  try{
    camStream = await navigator.mediaDevices.getUserMedia({video:{facingMode:{ideal:'environment'}, width:{ideal:1280}, height:{ideal:720}}, audio:false});
  }catch(e){ scanMsg('Camera permission was blocked. Allow camera access for this site in your browser settings, then try again.', 'warn'); return; }
  const box = $('#scanBox'); if (!box){ stopCamera(); return; }
  const v = box.querySelector('video'); v.srcObject = camStream;
  try { await v.play(); } catch(e){}
  let detect;
  try{
    if ('BarcodeDetector' in window && (await BarcodeDetector.getSupportedFormats()).includes('qr_code')){
      const det = new BarcodeDetector({formats:['qr_code']});
      detect = async () => { const c = await det.detect(v); return c.length ? c[0].rawValue : null; };
    }
  }catch(e){}
  if (!detect){
    try { await loadJsQR(); } catch(e){ scanMsg('Scanner could not load. Use the buttons instead.', 'warn'); return; }
    const cv = document.createElement('canvas'), ctx = cv.getContext('2d', {willReadFrequently:true});
    detect = async () => {
      if (!v.videoWidth) return null;
      const w = 480, h = Math.round(v.videoHeight * w / v.videoWidth);
      cv.width = w; cv.height = h; ctx.drawImage(v, 0, 0, w, h);
      const r = jsQR(ctx.getImageData(0, 0, w, h).data, w, h, {inversionAttempts:'dontInvert'});
      return r ? r.data : null;
    };
  }
  scanMsg('Point at the QR code');
  let busy = false;
  camLoop = setInterval(async () => {
    if (busy || !camStream) return; busy = true;
    try{
      const val = await detect();
      if (val && !(val === lastScan.v && Date.now() - lastScan.t < 10000)){ lastScan = {v:val, t:Date.now()}; handleScan(val, mode); }
    }catch(e){}
    busy = false;
  }, 220);
}
function handleScan(val, mode){
  const parts = String(val).split('|');
  if (parts[0] !== 'CAMPPASS' || !W.members[parts[2]]){ buzz([40,30,40]); return scanMsg('Not a CampPass code. Try again.', 'warn'); }
  const code = parts[2], p = W.members[code].profile;
  if (parts[1] !== 'ID'){
    if (parts[3] !== today()){ buzz([40,30,40]); return scanMsg(`${esc(p.first)}'s ticket is for another day.`, 'warn'); }
    const meal = (parts[4]||'').toLowerCase();
    if (MEAL[meal] && meal !== U.meal){ U.meal = meal; saveAll(); render(); }
  }
  const t = T(U.meal, code), who = `<b>${esc(p.first)} ${esc(p.last)}</b>`;
  if (mode === 'checkin'){
    if (t.status === 'ready'){ const r = act({type:'checkin', code}); return r.ok ? scanMsg(`${ICON.check} ${who} · #${qpos(U.meal, code)} in queue`, 'info') : scanMsg(esc(r.msg), 'warn'); }
    if (t.status === 'queued') return scanMsg(`${who} · already #${qpos(U.meal, code)} in queue`, 'warn');
    if (t.status === 'rollover' && !t.redeemedAt) return scanMsg(`${ICON.star} ${who} · priority pass`, 'vio');
    return scanMsg(`${who} · already served`, 'warn');
  }
  if (t.status === 'queued' || (t.status === 'rollover' && !t.redeemedAt)){ const r = act({type:'serve', code}); return r.ok ? scanMsg(`${ICON.check} ${who} served`, 'info') : scanMsg(esc(r.msg), 'warn'); }
  if (t.status === 'ready') return scanMsg(`${who} · not checked in yet`, 'warn');
  return scanMsg(`${who} · already served`, 'warn');
}
function stopCamera(){
  clearInterval(camLoop); camLoop = null;
  if (camStream){ camStream.getTracks().forEach(t=>t.stop()); camStream = null; }
}

/* =========================================================
   Install prompt (Android/Chrome native + iOS instructions)
   ========================================================= */
let deferredPrompt = null, splashDone = false;
const isStandalone = () => window.matchMedia('(display-mode: standalone)').matches || navigator.standalone === true;
const isIOS = () => /iphone|ipad|ipod/i.test(navigator.userAgent) || (navigator.platform==='MacIntel' && navigator.maxTouchPoints>1);
function showInstall(){
  if (isStandalone()) return;
  let snoozed = 0; try { snoozed = +localStorage.getItem('camppass.installSnooze')||0; } catch(e){}
  if (Date.now() - snoozed < 20*60000) return;
  if (deferredPrompt || isIOS()){ $('#install').classList.add('show'); document.body.classList.add('has-install'); }
}
async function doInstall(){
  $('#install').classList.remove('show'); document.body.classList.remove('has-install');
  if (deferredPrompt){
    deferredPrompt.prompt();
    const {outcome} = await deferredPrompt.userChoice; deferredPrompt = null;
    if (outcome==='accepted') toast('Installing CampPass…');
  } else if (isIOS()) iosSheet();
  else openSheet(`<h3>Install CampPass</h3><p>Open your browser menu <b>⋮</b> and tap <b>Install app</b> or <b>Add to Home screen</b>.</p><button class="btn primary" data-act="close">Got it</button>`);
}
window.addEventListener('beforeinstallprompt', e => { e.preventDefault(); deferredPrompt = e; if (splashDone) setTimeout(showInstall, 600); });
window.addEventListener('appinstalled', () => { $('#install').classList.remove('show'); document.body.classList.remove('has-install'); toast('CampPass installed'); });

/* =========================================================
   Events
   ========================================================= */
document.addEventListener('click', e => {
  const b = e.target.closest('button'); if (!b) return;
  const d = b.dataset;
  if (d.role){ if (U.role!==d.role){ U.role = d.role; saveAll(); render(); scrollTo({top:0}); buzz(8);} return; }
  if (d.tab){ if (U.role==='kitchen') U.ktab = d.tab; else U.tab = d.tab; saveAll(); render(); scrollTo({top:0}); buzz(5); return; }
  if (d.meal){ U.meal = d.meal; saveAll(); render(); buzz(5); return; }
  if (d.scanner){ openScanner(d.scanner); return; }
  if (d.checkin){ act({type:'checkin', code:d.checkin}); return; }
  if (d.serve){ act({type:'serve', code:d.serve}); return; }
  if (d.me){ U.me = d.me; saveAll(); closeSheet(); render(); toast(`Signed in as ${W.members[d.me].profile.first}`); return; }
  if (d.go){ U.role = d.go; if (d.go==='kitchen'){ U.ktab='gate'; U.q=''; } else U.tab='meal'; saveAll(); render(); scrollTo({top:0, behavior:'smooth'}); return; }
  const handlers = {
    checkin: ()=>act({type:'checkin', code:U.me}),
    serve:   ()=>act({type:'serve', code:U.me}),
    finish:  ()=>act({type:'finish'}),
    minus:   ()=>act({type:'removePlate'}),
    plus:    ()=>act({type:'addPlates', n:1}),
    batch:   ()=>act({type:'addPlates', n:20}),
    close: closeSheet,
    install: ()=>{ closeSheet(); doInstall(); },
    editname: nameSheet,
    whoami: whoSheet,
    reset: ()=>{ closeSheet(); act({type:'reset', meal:undefined}); },
  };
  if (d.act && handlers[d.act]) handlers[d.act]();
});
$('#menuBtn').addEventListener('click', settingsSheet);
$('#scrim').addEventListener('click', closeSheet);
$('#installGo').addEventListener('click', doInstall);
$('#installX').addEventListener('click', ()=>{ $('#install').classList.remove('show'); document.body.classList.remove('has-install'); try{ localStorage.setItem('camppass.installSnooze', Date.now()); }catch(e){} });
addEventListener('scroll', ()=>$('#hdr').classList.toggle('scrolled', scrollY>4), {passive:true});
addEventListener('resize', placeThumb);
addEventListener('storage', e => { if (e.key===WKEY){ const w = read(WKEY); if (w && w.v===E.VERSION){ W = w; render(); } } });
document.addEventListener('visibilitychange', ()=>{ if (!document.hidden){ render(); if (net!=='local' && (!sse || sse.readyState===2)) connect(); } });
setInterval(()=>{ if (outbox.length && net!=='local') flush(); }, 10000);

/* =========================================================
   Boot
   ========================================================= */
$('#icoUser').outerHTML = hi('user', 16); $('#icoChef').outerHTML = hi('chef', 16); $('#icoMenu').outerHTML = hi('menu', 24);
$('#installX').innerHTML = hi('x', 18, 'bold');
ensure(); render();
setTimeout(()=>{ $('#splash').classList.add('gone'); splashDone = true; placeThumb(); setTimeout(showInstall, 1200); }, 1400);
if (location.protocol === 'file:') setNet('local'); else connect();
if ('serviceWorker' in navigator && location.protocol !== 'file:'){
  addEventListener('load', ()=>navigator.serviceWorker.register('sw.js').catch(()=>{}));
}
})();
</script>
